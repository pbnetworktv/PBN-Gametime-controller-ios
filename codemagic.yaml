workflows:
  pbn-ios-testflight:
    name: PBN Game Time Controller — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: PBN Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tv.pbnetwork.gametimecontroller
      vars:
        BUNDLE_ID: tv.pbnetwork.gametimecontroller
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      xcode: 26.6
      cocoapods: default

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Run controller tests
        script: npm test

      - name: Build web application
        script: npm run build

      - name: Generate native iOS project
        script: |
          npx cap add ios
          bash scripts/configure-ios.sh
          npx cap sync ios

      - name: Install iOS dependencies
        script: |
          cd ios/App
          pod install

      - name: Apply App Store signing profile
        script: xcode-project use-profiles

      - name: Set TestFlight build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
